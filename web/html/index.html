<style>
:root{--navy:#182448;--ink:#202c42;--muted:#68768b;--line:#e0e6ef;--bg:#f5f7fb;--blue:#315fe9;--teal:#087f71;--amber:#98600c;--shadow:0 8px 30px #1e315508}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #88a9ff;outline-offset:3px}button{transition:background .15s,transform .15s}button:not(:disabled):active{transform:translateY(1px)}a{color:var(--blue)}
.top{background:white;border-bottom:1px solid var(--line);height:78px;display:flex;align-items:center;padding:0 30px;gap:32px;position:sticky;top:0;z-index:5}.brand{display:flex;gap:10px;align-items:center;min-width:240px;font-weight:750;letter-spacing:-.5px;font-size:20px}.mark{display:grid;place-items:center;width:34px;height:36px;background:var(--navy);color:white;border-radius:11px 11px 14px 5px;font-size:21px}.tabs{height:100%;display:flex;gap:28px}.tab{border:0;border-bottom:3px solid transparent;background:none;padding:0 2px;color:var(--muted);font-weight:600}.tab[aria-selected=true]{color:var(--navy);border-bottom-color:var(--blue)}.topright{margin-left:auto;display:flex;align-items:center;gap:14px}.avatar{width:33px;height:33px;border-radius:50%;background:#e9edf6;display:grid;place-items:center;font-size:12px;font-weight:750}.prototype{font-size:11px;letter-spacing:.08em;text-transform:uppercase;border:1px solid #d6deef;border-radius:5px;padding:4px 8px;color:#63728b}.shell{display:grid;grid-template-columns:238px 1fr;min-height:calc(100vh - 78px)}aside{background:white;border-right:1px solid var(--line);padding:25px 16px;display:flex;flex-direction:column;gap:7px}.eyebrow{font-size:10px;letter-spacing:.12em;font-weight:750;color:var(--muted);text-transform:uppercase}.asidehead{display:flex;justify-content:space-between;margin:0 12px 10px}.system{border:0;border-radius:7px;display:flex;gap:11px;align-items:center;background:transparent;text-align:left;padding:10px 12px;color:#56647a}.system.active{background:#edf2ff;color:var(--navy);font-weight:700}.sysicon{width:27px;height:27px;display:grid;place-items:center;border:1px solid #e1e6ee;border-radius:7px;background:white;font-size:10px;font-weight:800;color:var(--navy)}.dot{height:6px;width:6px;background:#219887;border-radius:50%;margin-left:auto}.asidefoot{margin-top:auto;padding:30px 12px 0;font-size:11px;color:var(--muted)}.asidefoot strong{display:block;color:var(--ink);font-size:12px;margin-bottom:4px}main{padding:32px 36px 24px;max-width:1700px;width:100%;margin:auto}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px;gap:16px}h1{font-size:28px;letter-spacing:-.8px;line-height:1.25;margin:5px 0 8px}p{margin:0;color:var(--muted)}h2{margin:0;font-size:17px;letter-spacing:-.3px}h3{font-size:14px;margin:0}small{color:var(--muted)}.btn{border:1px solid #d9e0eb;padding:9px 14px;border-radius:7px;background:white;color:var(--ink);font-weight:600;font-size:12px;white-space:nowrap}.btn:hover:not(:disabled){background:#f0f4fc}.primary{background:var(--blue);color:white;border-color:var(--blue)}.primary:hover:not(:disabled){background:#234bcc}.textbtn{border:0;background:none;color:var(--blue);font-size:12px;font-weight:650;padding:6px}.select{border:1px solid var(--line);background:white;border-radius:7px;padding:9px 12px;color:var(--ink);font-size:12px}.context{display:flex;gap:10px;align-items:center}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:24px}.metric{background:white;border:1px solid var(--line);border-radius:10px;padding:18px 21px;box-shadow:var(--shadow)}.metric b{font-size:27px;letter-spacing:-1px;margin-right:8px}.metric .label{color:var(--muted);font-size:12px;margin-bottom:6px}.metric small{font-size:11px}.grid{display:grid;grid-template-columns:minmax(390px,1.5fr) minmax(330px,1fr);gap:22px;align-items:start}.card{border:1px solid var(--line);border-radius:11px;background:white;box-shadow:var(--shadow);overflow:hidden}.cardhead{padding:20px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:15px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.row{padding:21px 22px;border-bottom:1px solid #edf0f5;display:flex;gap:16px;align-items:center}.row:last-child{border-bottom:0}.row.selected{background:#f7f9ff;box-shadow:inset 3px 0 var(--blue)}.row .grow{flex:1;min-width:0}.rowtitle{font-weight:650;margin-bottom:4px}.meta{font-size:11px;color:var(--muted)}.pill{font-size:10px;font-weight:650;padding:4px 7px;border-radius:4px;display:inline-block;white-space:nowrap}.neutral{background:#eef1f6;color:#637189}.good{background:#e7f5ef;color:#18725b}.warn{background:#fff3df;color:#94600e}.blue{background:#edf2ff;color:#355abd}.circle{width:34px;height:34px;display:grid;place-items:center;background:#f0f3fa;border-radius:9px;flex-shrink:0;color:#6d7d99;font-size:16px}.pad{padding:21px 22px}.steps{display:flex;gap:8px;margin:18px 0 22px}.step{flex:1;font-size:10px;color:#8390a3;line-height:1.5}.step:before{content:"";display:block;height:3px;background:#e7ebf2;margin-bottom:8px;border-radius:2px}.step.done{color:var(--teal)}.step.done:before{background:var(--teal)}.step.current{color:var(--blue);font-weight:700}.step.current:before{background:var(--blue)}.checklist{list-style:none;margin:15px 0;padding:0}.checklist li{padding:10px 0;display:flex;gap:11px;align-items:flex-start}.checkicon{width:20px;height:20px;flex-shrink:0;border:1px solid #d8dfeb;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#a3afbf}.checkicon.complete{background:#e7f5ef;border-color:#e7f5ef;color:var(--teal)}.checktext{font-size:12px}.checktext small{display:block;font-size:11px}.notice{border:1px solid #dce6fa;background:#f5f8ff;border-radius:7px;padding:12px;font-size:11px;color:#506485;line-height:1.65}.notice.amber{background:#fffaf0;border-color:#f0dfbc;color:#896126}.attachment{border:1px solid #d8e2f6;border-radius:8px;padding:13px;display:flex;gap:10px;align-items:center;margin:17px 0}.attachment strong{font-size:11px;overflow-wrap:anywhere;display:block}.attachment small{font-size:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.validation{margin-top:16px}.validation label{font-size:12px;display:flex;align-items:flex-start;gap:9px;padding:7px 0}.validation input{accent-color:var(--blue);margin-top:4px}.field{display:block;width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;margin-top:5px;min-height:68px;resize:vertical}.fieldlabel{display:block;font-size:11px;font-weight:650;margin-top:14px}.footer{margin-top:25px;display:flex;gap:12px;justify-content:space-between;color:#8b95a6;font-size:10px}.legend{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--muted)}.legend i{height:6px;width:6px;border-radius:50%;background:var(--teal)}.issue{border:1px solid var(--line);border-radius:8px;padding:14px;margin:12px 0}.issue .meta{margin-top:6px}.issuehead{display:flex;justify-content:space-between;gap:10px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}.detailgrid span{display:block;font-size:10px;color:var(--muted)}.detailgrid b{font-weight:550;font-size:12px}.empty{text-align:center;padding:35px 15px}.empty .circle{margin:0 auto 12px}.audit{border-top:1px solid var(--line);margin-top:20px;padding-top:15px}.audit div{font-size:10px;color:var(--muted);padding:5px 0}.audit div:before{content:'•';color:#8fabc6;margin-right:8px}.spinner{width:12px;height:12px;border:2px solid #bed0ff;border-top-color:var(--blue);border-radius:50%;display:inline-block;animation:spin .6s linear infinite;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:white;font-size:12px;padding:12px 20px;border-radius:9px;box-shadow:0 8px 32px #18244833;z-index:20;max-width:90vw}dialog{border:1px solid var(--line);border-radius:13px;padding:0;width:min(880px,92vw);max-height:88vh;box-shadow:0 20px 100px #18244840;color:var(--ink)}dialog::backdrop{background:#15244177;backdrop-filter:blur(3px)}.modalhead{position:sticky;top:0;background:white;display:flex;align-items:center;justify-content:space-between;padding:19px 24px;border-bottom:1px solid var(--line);z-index:1}.modalbody{padding:25px}.close{border:0;background:#f1f4f8;border-radius:6px;padding:5px 10px;font-size:18px}table{border-collapse:collapse;width:100%;font-size:11px;margin:18px 0}th{text-align:left;color:var(--muted);font-size:10px;background:#f5f7fb}td,th{padding:11px;border-bottom:1px solid var(--line)}.intro{padding:13px 18px;margin-bottom:22px;background:#edf3ff;border:1px solid #dce7ff;border-radius:8px;font-size:12px;color:#4c648d;display:flex;justify-content:space-between;align-items:center;gap:15px}.intro strong{color:#264c90}.mobileLabel{display:none}
@media(min-width:1500px){main{padding:38px 50px}.row{padding:25px 25px}}
@media(max-width:1100px){.top{gap:18px;padding:0 20px}.brand{min-width:210px}.shell{grid-template-columns:190px 1fr}main{padding:24px}.grid{grid-template-columns:1fr}.tabs{gap:15px}.prototype{display:none}.metric{padding:15px}.topright .avatar{display:none}}
@media(max-width:700px){.top{height:auto;flex-wrap:wrap;padding:15px 18px 0;gap:8px}.brand{font-size:18px}.topright{position:absolute;right:16px;top:17px}.tabs{width:100%;height:48px;gap:24px}.tab{font-size:12px}.shell{display:block}aside{flex-direction:row;overflow:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line);gap:4px}.system{flex-shrink:0;font-size:12px;padding:7px 10px}.system .dot,.asidehead,.asidefoot,.sysicon{display:none}main{padding:23px 16px}.heading{align-items:flex-start;flex-direction:column}.context{flex-wrap:wrap}h1{font-size:25px}.metrics{gap:8px}.metric{padding:12px}.metric b{font-size:24px;display:block}.metric small{display:none}.metric .label{font-size:10px}.grid{display:block}.card{margin-bottom:16px}.row,.pad,.cardhead{padding:17px}.row{gap:10px}.row .circle{display:none}.row .btn{padding:8px 10px}.intro{font-size:11px}.footer{flex-direction:column}.detailgrid{gap:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<header class="top"><div class="brand"><span class="mark" aria-hidden="true">✓</span>Compliance Partner</div><nav class="tabs" role="tablist" aria-label="Application workspace"><button class="tab" role="tab" id="prepTab" aria-controls="workspace" aria-selected="true" onclick="switchTab('prepare')">Control preparation</button><button class="tab" role="tab" id="monitorTab" aria-controls="workspace" aria-selected="false" onclick="switchTab('monitor')">Compliance monitoring</button></nav><div class="topright"><span class="prototype">Interactive prototype</span><button class="textbtn" onclick="showGuide()" aria-label="Open prototype guide">Guide</button><span class="avatar" title="Demo workspace">CW</span></div></header>
<div class="shell"><aside aria-label="SOX systems"><div class="asidehead"><span class="eyebrow">SOX systems</span><span class="eyebrow">10</span></div><div id="systems" style="display:contents"></div><div class="asidefoot"><strong>October Hackathon</strong>Illustrative data · No live connections<br><button class="textbtn" style="padding-left:0;margin-top:8px" onclick="resetDemo()">Reset prototype</button></div></aside><main id="workspace" role="tabpanel" aria-labelledby="prepTab"></main></div>
<dialog id="modal" aria-labelledby="modalTitle"><div class="modalhead"><h2 id="modalTitle"></h2><button class="close" aria-label="Close dialog" onclick="document.getElementById('modal').close()">×</button></div><div id="modalBody" class="modalbody"></div></dialog><div id="toast" role="status" hidden></div>
<script>
'use strict';
const systems=['Workato','NetSuite','Workday','Salesforce','Coupa','Orderful','GitHub','Okta','FloQast'];
const controls=[{name:'User access review',id:'UA-04',cadence:'Quarterly',icon:'◎'},{name:'Change management',id:'CM-02',cadence:'Monthly',icon:'⇄'},{name:'SOC 1 assessment',id:'ELC-14',cadence:'Annual / semiannual',icon:'▤'}];
const checks=[{name:'Employee & contractor termination',desc:'Compare termination dates with account disable dates',count:2,icon:'↗'},{name:'Password policy alignment',desc:'Compare SOX in-scope system settings with corporate policy',count:1,icon:'⌘'},{name:'Provisioning & least privilege',desc:'Match approved requests to assigned access',count:1,icon:'⊕'}];
let app={tab:'prepare',system:'Workato',period:'Q3 FY26',control:0,check:0,records:{},issues:{},events:{},lastRun:null};let timer=null,toastTimer;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function key(){return [app.system,app.period,app.control].join('|')}function rec(){return app.records[key()]||(app.records[key()]={stage:'idle',progress:0,validated:[false,false,false],comment:'',review:'',events:[]})}function log(r,t){r.events.unshift(new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · '+t)}
function toast(t){$('toast').textContent=t;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3600)}
function switchTab(t){app.tab=t;render()}function selectSystem(s){app.system=s;render()}function changePeriod(p){app.period=p;render()}function selectControl(i){app.control=i;render()}function selectCheck(i){app.check=i;render()}
function render(){document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.id===(app.tab==='prepare'?'prepTab':'monitorTab'))));$('workspace').setAttribute('aria-labelledby',app.tab==='prepare'?'prepTab':'monitorTab');$('systems').innerHTML=systems.map((s,i)=>`<button class="system ${app.system===s?'active':''}" aria-pressed="${app.system===s}" onclick="selectSystem('${s}')"><span class="sysicon">${['W','NS','WD','SF','C','O','GH','OK','F'][i]}</span>${s}<span class="dot"></span></button>`).join('')+`<button class="system ${app.system==='Other systems'?'active':''}" onclick="moreSystems()"><span class="sysicon">+</span>More systems</button>`;$('workspace').innerHTML=app.tab==='prepare'?prepareView():monitorView();}
function heading(title,desc){return `<div class="heading"><div><div class="eyebrow">Workspace / ${esc(app.system)}</div><h1>${title}</h1><p>${desc}</p></div><div class="context"><span class="legend"><i></i>Demo workspace</span>${app.tab==='prepare'?`<label><span class="mobileLabel">Period</span><select class="select" aria-label="Reporting period" onchange="changePeriod(this.value)">${['Q3 FY26','Q2 FY26','Q1 FY26'].map(x=>`<option ${app.period===x?'selected':''}>${x}</option>`).join('')}</select>`:`<button class="btn" onclick="runMonitoring()" id="runBtn">↻ Run monitoring checks</button>`}</div></div>`}
function metrics(items){return `<div class="metrics">${items.map(x=>`<div class="metric"><div class="label">${x[0]}</div><b>${x[1]}</b><small>${x[2]}</small></div>`).join('')}</div>`}
function prepareView(){let r=rec(),done=Object.entries(app.records).filter(([k,v])=>k.startsWith(app.system+'|'+app.period+'|')&&v.stage==='approved').length;return heading('Control preparation','From source evidence to a workpaper ready for management sign-off.')+`<div class="intro"><span><strong>Try the workflow.</strong> Prepare a workpaper, inspect the attachment, validate it, then switch to management review.</span><span class="pill blue">Illustrative data</span></div>`+metrics([['Control areas','3','available to prepare'],['Period',app.period.split(' ')[0],'Fiscal year 2026'],['Management sign-off',done+'/3','workpapers approved']])+`<div class="grid"><section class="card"><div class="cardhead"><div><h2>${esc(app.system)} controls</h2><div class="sub">Choose a control to build its evidence package</div></div><span class="pill neutral">${app.period}</span></div>${controls.map((c,i)=>{let x=app.records[[app.system,app.period,i].join('|')],state=x?.stage||'idle';return `<div class="row ${app.control===i?'selected':''}"><span class="circle">${c.icon}</span><div class="grow"><div class="rowtitle">${c.name}</div><div class="meta">${c.id} · ${c.cadence} · ${state==='idle'?'Not prepared':stageLabel(state)}</div></div><button class="btn ${app.control===i?'primary':''}" onclick="selectControl(${i});${state==='idle'?'startPrepare()':''}">${state==='idle'?'Prepare':'View workpaper'}</button></div>`}).join('')}<div class="pad"><div class="notice">The application organizes evidence and drafts the workpaper. A person validates completeness, accuracy and conclusions before submitting it to management. Controls marked &ldquo;Live capture&rdquo; collect real evidence; the rest are illustrative.</div></div></section><section class="card" aria-label="Workpaper workflow"><div class="cardhead"><div><div class="eyebrow">Workpaper workspace</div><h2 style="margin-top:5px">${controls[app.control].name}</h2><div class="sub">${esc(app.system)} · ${app.period}</div></div><span class="pill ${r.stage==='approved'?'good':r.stage==='idle'?'neutral':'blue'}">${stageLabel(r.stage)}</span></div><div class="pad">${workflow(r)}</div></section></div>`+footer()}
function stageLabel(s){return {idle:'Ready to prepare',preparing:'Preparing',generated:'Validation required',submitted:'Management review',approved:'Signed off',returned:'Changes requested'}[s]}
function workflow(r){let n={idle:0,preparing:0,generated:1,returned:1,submitted:2,approved:3}[r.stage];let steps=`<div class="steps">${['Prepare','Human validation','Management review','Sign off'].map((s,i)=>`<div class="step ${i<n?'done':i===n?'current':''}">${i+1}. ${s}</div>`).join('')}</div>`;if(r.stage==='idle')return steps+`<div class="empty"><div class="circle">▤</div><h3>Start with the source evidence</h3><p class="sub">Build a structured workpaper for this control and period.</p><button class="btn primary" style="margin-top:20px" onclick="startPrepare()">Prepare workpaper</button></div><div class="notice">Controls marked &ldquo;Live capture&rdquo; sign in and collect real, read-only evidence. The others create example workpapers locally and touch no system.</div>`;
const tasks=['Collect source evidence','Check population completeness','Reconcile and flag exceptions','Generate workpaper attachment'];let list=`<ul class="checklist">${tasks.map((t,i)=>`<li><span class="checkicon ${r.progress>i?'complete':''}">${r.progress>i?'✓':r.stage==='preparing'&&r.progress===i?'…':i+1}</span><div class="checktext">${t}<small>${['System export, period and scope','Counts and source timestamps','Items that need human judgment','Workpaper and evidence manifest'][i]}</small></div></li>`).join('')}</ul>`;if(r.stage==='preparing')return steps+`<div role="status"><span class="spinner"></span>Building example workpaper…</div>`+list;
let attachment=`<div class="attachment"><span class="circle">▤</span><div style="flex:1"><strong>${filename()}</strong><small>HTML workpaper · Local example</small></div><button class="textbtn" onclick="previewWorkpaper()">Preview</button></div><div class="actions" style="margin-top:0"><button class="btn" onclick="downloadWorkpaper()">↓ Download workpaper</button><button class="textbtn" onclick="downloadEvidence()">Evidence CSV</button></div>`;
let body='';if(r.stage==='generated'||r.stage==='returned'){body=`${r.stage==='returned'?`<div class="notice amber" style="margin-top:18px"><strong>Management requested changes</strong><br>${esc(r.review)}</div>`:''}<div class="validation"><h3>Preparer validation</h3><p class="sub">Inspect the workpaper before completing these checks.</p>${['Source evidence and population are complete','Reconciliation and identified exceptions are accurate','Conclusions are supported and ready for review'].map((t,i)=>`<label><input type="checkbox" ${r.validated[i]?'checked':''} onchange="toggleValidation(${i},this.checked)">${t}</label>`).join('')}<label class="fieldlabel" for="prepComment">Validation notes <span style="font-weight:400">(optional)</span></label><textarea id="prepComment" class="field" placeholder="Explain an exception or document your validation." oninput="rec().comment=this.value">${esc(r.comment)}</textarea><div class="actions"><button id="submitBtn" class="btn primary" ${r.validated.every(Boolean)?'':'disabled'} onclick="submitReview()">Submit for management review →</button></div></div>`}else if(r.stage==='submitted'){body=`<div class="notice" style="margin-top:20px"><strong>Ready for management review</strong><br>Preparer validation is complete. Management must review the evidence and record a decision.</div><button class="btn primary" style="margin-top:17px" onclick="managementReview()">Open management review</button><p class="sub">Prototype role switch · No notification is sent.</p>`}else{body=`<div class="notice" style="margin-top:20px;border-color:#cde9dd;background:#eff9f3;color:#286d52"><strong>✓ Management sign-off recorded</strong><br>This example workpaper is complete for ${app.period}.</div><p class="sub" style="margin-top:10px">Reviewer: Demo management reviewer</p>${r.review?`<p class="sub">Decision note: ${esc(r.review)}</p>`:''}`}
return steps+attachment+body+`<details class="audit"><summary style="font-size:11px;color:var(--muted);cursor:pointer">Activity history (${r.events.length})</summary>${r.events.map(e=>`<div>${esc(e)}</div>`).join('')}</details>`}
function startPrepare(){let r=rec();if(r.stage!=='idle')return;let k=key();r.stage='preparing';log(r,'Preparation started');render();let count=0;let t=setInterval(()=>{count++;r.progress=count;if(count===4){clearInterval(t);r.stage='generated';log(r,'Workpaper generated; human validation required')}if(key()===k&&app.tab==='prepare')render()},450);}
function toggleValidation(i,v){rec().validated[i]=v;$('submitBtn').disabled=!rec().validated.every(Boolean)}function submitReview(){let r=rec();if(!r.validated.every(Boolean))return;r.stage='submitted';log(r,'Preparer validated and submitted for management review');render();toast('Submitted to the prototype management review queue.')}
function filename(){return app.system.replaceAll(' ','_')+'_'+controls[app.control].id+'_'+app.period.replaceAll(' ','_')+'.html'}
function workpaper(){let r=rec(),c=controls[app.control];return `<div class="eyebrow">Compliance Partner / Example workpaper</div><h1 style="font-size:25px">${esc(app.system)} · ${c.name}</h1><p>${app.period} · ${c.id} · ${stageLabel(r.stage)}</p><div class="notice amber" style="margin-top:18px">Illustrative evidence only. This document is generated by a prototype, not a performed control or an audit conclusion.</div><h3 style="margin-top:23px">Objective and scope</h3><p class="sub">${['Assess whether access remains appropriate for the users’ responsibilities, including privileged and shared accounts.','Assess whether in-scope production changes have appropriate authorization, testing and deployment evidence.','Assess the relevant service organization report, coverage, exceptions and complementary user entity controls.'][app.control]}</p><table><tr><th>Evidence item</th><th>Example result</th><th>Disposition</th></tr>${evidenceRows().map(a=>`<tr>${a.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table><h3>Draft conclusion</h3><p class="sub">Evidence has been organized for human review. Any exception requires validation and a documented disposition before management sign-off.</p><h3 style="margin-top:20px">Preparer validation</h3><p class="sub">${r.validated.every(Boolean)?'All three validation checks completed.':'Validation is pending.'} ${esc(r.comment||'No preparer note recorded.')}</p><h3 style="margin-top:20px">Management review</h3><p class="sub">${r.stage==='approved'?'Signed off by Demo management reviewer.':r.stage==='returned'?'Changes requested.':'Sign-off pending.'} ${esc(r.review)}</p><h3 style="margin-top:20px">Activity history</h3>${r.events.map(e=>`<p class="sub">${esc(e)}</p>`).join('')}`}
function evidenceRows(){return app.control===0?[['User listing','1,284 example records','Population reconciled'],['Employee / contractor reconciliation','2 accounts requiring attention','Human disposition required'],['Access appropriateness','Reviewer worksheet included','Preparer validation required']]:app.control===1?[['Production change listing','42 example changes','Population reconciled'],['Approval and testing linkage','40 matched; 2 need clarification','Human disposition required'],['Deployment evidence','Timestamp manifest included','Review required']]:[['SOC 1 report','Illustrative report reference','Confirm service and reporting period'],['Complementary user entity controls','8 example mappings','Validate applicable controls'],['Exceptions and coverage gaps','1 example item for follow-up','Document reliance conclusion']]}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').showModal()}
function previewWorkpaper(){modal('Workpaper preview',workpaper()+`<div class="actions"><button class="btn primary" onclick="downloadWorkpaper()">Download workpaper</button></div>`)}
function download(name,type,content){let url=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadWorkpaper(){download(filename(),'text/html','<!doctype html><html lang="en"><meta charset="utf-8"><title>Example control workpaper</title><style>body{max-width:850px;margin:45px auto;padding:24px;font:14px/1.65 Arial;color:#202c42}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #ddd}h1{color:#182448}.notice{padding:15px;background:#fff5df}.sub{color:#657084}.eyebrow{font-size:11px;text-transform:uppercase}</style>'+workpaper()+'</html>');toast('Example workpaper downloaded.')}
function downloadEvidence(){let rows=[['Evidence item','Example result','Disposition'],...evidenceRows()];download('example-evidence-manifest.csv','text/csv',rows.map(r=>r.map(v=>'"'+v.replaceAll('"','""')+'"').join(',')).join('\r\n'));toast('Example evidence manifest downloaded.')}
function managementReview(){let r=rec();modal('Management review',`<div class="eyebrow">Demo management reviewer</div><h2 style="margin:10px 0">${esc(app.system)} · ${controls[app.control].name}</h2><p class="sub">${app.period} · Preparer checks complete</p><div class="notice" style="margin-top:15px">${esc(r.comment||'No additional preparer note. Review the attachment and exception disposition before signing off.')}</div><button class="textbtn" style="margin-top:10px" onclick="$('reviewEvidence').hidden=!$('reviewEvidence').hidden">Show / hide workpaper</button><div id="reviewEvidence" hidden>${workpaper()}</div><label class="validation" style="display:flex;gap:9px"><input id="managerCheck" type="checkbox" onchange="$('approveBtn').disabled=!this.checked">I reviewed the workpaper, evidence and conclusions.</label><label class="fieldlabel" for="managerNote">Management decision note</label><textarea id="managerNote" class="field" placeholder="Required when requesting changes."></textarea><div class="actions"><button class="btn primary" id="approveBtn" disabled onclick="managementDecision(true)">Sign off</button><button class="btn" onclick="managementDecision(false)">Request changes</button></div><p class="sub">This records a simulated decision only.</p>`)}
function managementDecision(approved){let r=rec(),note=$('managerNote').value.trim();if(approved&&!$('managerCheck').checked)return;if(!approved&&!note){toast('Add a note explaining the changes needed.');$('managerNote').focus();return}r.review=note;r.stage=approved?'approved':'returned';if(!approved)r.validated=[false,false,false];log(r,approved?'Demo management reviewer signed off':'Management requested changes: '+note);$('modal').close();render();toast(approved?'Prototype sign-off recorded.':'Returned to the preparer with review notes.')}
function issueList(){return app.check===0?[{id:'TERM-014',title:'Employee account remains active',account:'EMP-014',expected:'Disabled within policy deadline',observed:'Active after deadline',severity:'High'},{id:'TERM-008',title:'Contractor access needs review',account:'CTR-008',expected:'Access ends with contract',observed:'Account remains enabled',severity:'High'}]:app.check===1?[{id:'AUTH-003',title:'Local password configuration differs',account:'Local authentication',expected:'Match corporate policy',observed:'One configuration mismatch',severity:'Medium'}]:[{id:'ACCESS-021',title:'Assigned access exceeds approval',account:'USR-021',expected:'Approved standard role',observed:'Additional privileged role',severity:'High'}]}
function issueKey(id){return app.system+'|'+id}function issueState(id){return app.issues[issueKey(id)]||{status:'Open',note:''}}function totalOpen(){let old=app.check,sum=0;for(let i=0;i<3;i++){app.check=i;sum+=issueList().filter(x=>issueState(x.id).status!=='Resolved').length}app.check=old;return sum}
function monitorView(){let open=totalOpen(),issues=issueList();return heading('Compliance monitoring','Detect exceptions, investigate evidence, and document a human disposition.')+`<div class="intro"><span><strong>Continuous control, clear oversight.</strong> Review a flagged item and record its disposition. All records below are examples.</span><span class="pill blue">Illustrative data</span></div>`+metrics([['Monitoring checks','3','selected control areas'],['Unresolved exceptions',open,'across this demo system'],['Last check',app.lastRun?'Now':'09:14','example snapshot']])+`<div class="grid"><section class="card"><div class="cardhead"><div><h2>${esc(app.system)} monitoring</h2><div class="sub">SOX in-scope system · Example policy comparison</div></div><span class="pill good">Connected · Demo</span></div>${checks.map((c,i)=>{let old=app.check;app.check=i;let count=issueList().filter(x=>issueState(x.id).status!=='Resolved').length;app.check=old;return `<div class="row ${app.check===i?'selected':''}"><span class="circle">${c.icon}</span><div class="grow"><div class="rowtitle">${c.name}</div><div class="meta">${c.desc}</div><span style="margin-top:9px" class="pill ${count?'warn':'good'}">${count?count+' unresolved':'No unresolved items'}</span></div><button class="btn ${app.check===i?'primary':''}" onclick="selectCheck(${i})">Review</button></div>`}).join('')}<div class="pad"><div class="notice">A monitoring flag prompts investigation. It does not automatically establish a control failure or determine its SOX impact.</div></div></section><section class="card"><div class="cardhead"><div><div class="eyebrow">Issue details</div><h2 style="margin-top:5px">${checks[app.check].name}</h2><div class="sub">${esc(app.system)} · ${issues.length} example items</div></div></div><div class="pad">${issues.map(x=>{let z=issueState(x.id);return `<article class="issue"><div class="issuehead"><span class="pill ${z.status==='Resolved'?'good':'warn'}">${z.status==='Resolved'?'Resolved':x.severity+' priority'}</span><span class="meta">${x.id}</span></div><h3 style="margin-top:10px">${x.title}</h3><div class="detailgrid"><div><span>Account / scope</span><b>${x.account}</b></div><div><span>Status</span><b>${z.status}</b></div></div><div class="meta">${x.observed}</div>${z.note?`<div class="notice" style="margin-top:10px">${esc(z.note)}</div>`:''}<button class="textbtn" style="padding-left:0;margin-top:9px" onclick="investigate('${x.id}')">${z.status==='Resolved'?'View disposition':'Investigate and resolve'} →</button></article>`}).join('')}<p class="sub">No system access changes are made by this prototype.</p></div></section></div>`+footer()}
function investigate(id){let x=issueList().find(i=>i.id===id),z=issueState(id);modal('Exception investigation',`<div class="issuehead"><span class="pill warn">${x.severity} priority</span><span class="meta">${id} · ${esc(app.system)}</span></div><h2 style="margin-top:18px">${x.title}</h2><table><tr><th>Expected</th><th>Observed · Example</th></tr><tr><td>${x.expected}</td><td>${x.observed}</td></tr></table><div class="notice">Validate the source evidence, determine whether the flag is valid, and document remediation or an approved explanation. A human remains responsible for the decision.</div><label class="fieldlabel" for="issueStatus">Disposition</label><select class="select" id="issueStatus" style="width:100%;margin-top:6px">${['Open','Investigating','Resolved'].map(v=>`<option ${z.status===v?'selected':''}>${v}</option>`).join('')}</select><label class="fieldlabel" for="issueNote">Investigation / resolution note</label><textarea id="issueNote" class="field" placeholder="Document evidence reviewed, findings and follow-up.">${esc(z.note)}</textarea><div class="validation"><label><input id="evidenceCheck" type="checkbox">I verified supporting evidence for the disposition.</label></div><div class="actions"><button class="btn primary" onclick="saveIssue('${id}')">Save disposition</button></div>`)}
function saveIssue(id){let status=$('issueStatus').value,note=$('issueNote').value.trim();if(status!=='Open'&&!note){toast('Document your investigation or resolution.');$('issueNote').focus();return}if(status==='Resolved'&&!$('evidenceCheck').checked){toast('Verify supporting evidence before resolving the issue.');return}app.issues[issueKey(id)]={status,note};$('modal').close();render();toast('Example disposition saved. No external action was taken.')}
function runMonitoring(){let b=$('runBtn');b.disabled=true;b.textContent='Running example checks…';setTimeout(()=>{app.lastRun=new Date();render();toast('Demo checks complete. Existing dispositions were preserved.')},650)}
function moreSystems(){modal('More systems',`<p>Explore another system with the same illustrative workflow.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px">${['Kyriba','Rippling','JPMorgan','1Password','Equity Edge','Other systems'].map(x=>`<button class="btn" onclick="$('modal').close();selectSystem('${x}')">${x}</button>`).join('')}</div><p class="sub" style="margin-top:20px">Examples use a shared scenario. Availability and cadence are not a confirmed system control inventory.</p>`)}
function showGuide(){modal('Explore Compliance Partner',`<h3>1. Prepare</h3><p class="sub">Choose a system, reporting period and control. Click Prepare to simulate collecting and reconciling evidence.</p><h3 style="margin-top:20px">2. Inspect and validate</h3><p class="sub">Preview or download the generated HTML workpaper and evidence CSV. Complete the three human validation checks.</p><h3 style="margin-top:20px">3. Review and sign off</h3><p class="sub">Submit the workpaper, open management review, then sign off or return it with comments.</p><h3 style="margin-top:20px">4. Monitor and investigate</h3><p class="sub">Switch to Compliance monitoring. Inspect termination, password and provisioning flags. Add a supported disposition to resolve an example issue.</p><div class="notice amber" style="margin-top:22px">Most of this prototype uses fictional evidence and connects to nothing. The one exception is <strong>Workato → Change management</strong>, marked &ldquo;Live capture&rdquo;: that really does sign in to Workato, screenshot the recipe folders and version histories, and build an Excel workbook from what it saw. It is read-only — it never starts, stops, edits or deletes anything. Everything else, and every review decision, is simulated and resets when this page reloads.</div>`)}
function resetDemo(){if(Object.keys(app.records).length||Object.keys(app.issues).length){modal('Reset prototype?',`<p>This clears simulated workpapers and issue dispositions in this page. Downloaded files are unaffected.</p><div class="actions"><button class="btn primary" onclick="doReset()">Reset prototype</button><button class="btn" onclick="$('modal').close()">Keep working</button></div>`)}else toast('The prototype is already at its starting state.')}
function doReset(){$('modal').close();app.records={};app.issues={};app.lastRun=null;app.tab='prepare';app.system='Workato';app.control=0;render();toast('Prototype reset.')}
function footer(){return `<div class="footer"><span>Compliance Partner · Evidence prepared by the application. Decisions owned by people.</span><span>Local prototype · Fictional data · No external actions</span></div>`}
document.querySelectorAll('[role=tab]').forEach((b,i)=>b.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();switchTab(i===0?'monitor':'prepare');document.querySelectorAll('[role=tab]')[1-i].focus()}}));
render();
</script>
<script src="live-capture.js"></script>
</body></html>
