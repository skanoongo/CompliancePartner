<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Compliance Partner</title>
<link rel="stylesheet" href="auth.css">
</head>
<body class="authpage">

<main class="authcard" role="main">
  <div class="brand"><span class="mark" aria-hidden="true">✓</span>Compliance Partner</div>

  <h1>Sign in</h1>
  <p class="sub">Use your CoreWeave account. Access to each SOX system is granted by
  your Okta groups.</p>

  <div id="state" role="status"></div>

  <p class="fineprint">This workspace holds live, signed-in sessions to the systems under
  review. Sign-in is required for that reason, not only to identify you.</p>
</main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// Where to go after sign-in, if the user was sent here from somewhere specific.
// Only same-site paths, so a crafted ?next= cannot bounce anyone off to another host.
function nextTarget() {
  const raw = new URLSearchParams(location.search).get('next') || '/';
  return /^\/(?!\/)/.test(raw) ? raw : '/';
}

async function render() {
  let cfg;
  try {
    cfg = await (await fetch('/auth/config')).json();
  } catch (e) {
    $('state').innerHTML = `<div class="notice bad"><strong>The runner is not reachable.</strong>
      The sign-in service did not answer, so nobody can sign in right now.</div>`;
    return;
  }

  if (cfg.error) {
    $('state').innerHTML = `<div class="notice bad">
      <strong>Sign-in is misconfigured</strong>
      <p>${esc(cfg.error)}</p>
      <p class="mono">Fix config/auth.yaml, then restart the runner.</p>
      <p>Nothing is reachable until this is corrected — the site fails closed rather
      than letting everyone through.</p></div>`;
    return;
  }

  // Okta off: ask who this is. The site is still gated - otherwise the workspace
  // shows every system to anyone who opens the address.
  if (!cfg.enabled) {
    $('state').innerHTML = `
      <form id="localForm" autocomplete="off">
        <label class="fieldlabel" for="who">Your name</label>
        <input id="who" name="who" class="select" placeholder="e.g. Minh Nguyen"
               autocapitalize="words" autocomplete="name" required>
        <button class="btn primary" type="submit" style="margin-top:14px">Continue</button>
        <p id="whoErr" class="err" hidden></p>
      </form>
      <details class="who-help">
        <summary>Who can sign in?</summary>
        <p>Anyone in the user directory. An administrator adds people and assigns
           their SOX systems under <strong>User Administration</strong>.</p>
        <div id="whoList" class="who-list">Loading…</div>
      </details>
      <div class="notice warn" style="margin-top:20px">
        <strong>Local mode — a name is taken at face value</strong>
        <p>This decides which systems you see, not that you are who you say. Configure
           Okta in <span class="mono">config/auth.yaml</span> before this address is
           reachable by anyone you would not hand the password to.</p>
      </div>`;

    // Show the directory: a name typed blind is a guessing game, and this page
    // already admits it is not proving identity.
    fetch('/api/sox-systems').then(() => {}).catch(() => {});
    fetch('/api/whoami').then(r => r.json()).then(() => {}).catch(() => {});

    const form = $('localForm');
    const err = $('whoErr');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const name = $('who').value.trim();
      if (!name) return;
      let res, body;
      try {
        res = await fetch('/api/signin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: name })
        });
        body = await res.json();
      } catch (e2) {
        err.textContent = 'The runner is not reachable.';
        err.hidden = false;
        return;
      }
      if (!res.ok) {
        err.textContent = (body && body.message) || 'That name was not accepted.';
        err.hidden = false;
        return;
      }
      location.replace(nextTarget() === '/' ? '/choose' : nextTarget());
    });

    // List the names that will work, so nobody has to guess.
    fetch('/api/directory-names').then(r => r.ok ? r.json() : null).then(d => {
      const el = $('whoList');
      if (!el) return;
      el.textContent = '';
      if (!d || !d.names || !d.names.length) {
        el.textContent = 'The directory could not be read.';
        return;
      }
      d.names.forEach(n => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'who-chip';
        b.textContent = n.name + ' · ' + n.role;
        b.addEventListener('click', () => { $('who').value = n.name; $('who').focus(); });
        el.appendChild(b);
      });
    }).catch(() => {});
    return;
  }

  if (false) {
    // Name the step that is actually outstanding.
    const todo = {
      no_config: `<p class="mono">cp config/auth.example.yaml config/auth.yaml</p>
                  <p>Then fill in the Okta application details and set
                  <code>enabled: true</code>.</p>`,
      incomplete: `<p><strong>${esc(cfg.configPath || 'config/auth.yaml')}</strong> exists but
                   still needs: <code>${(cfg.missing || []).map(esc).join('</code>, <code>')}</code></p>
                   <p>Get these from the Okta application (Applications &rarr; your app
                   &rarr; General). Then set <code>enabled: true</code> and restart the
                   runner.</p>`,
      disabled: `<p>Everything is configured &mdash; sign-in is just switched off.
                 Set <code>enabled: true</code> in
                 <strong>${esc(cfg.configPath || 'config/auth.yaml')}</strong> and restart
                 the runner.</p>`
    }[cfg.step] || `<p>Set <code>enabled: true</code> in the auth config.</p>`;

    $('state').innerHTML = `<div class="notice warn">
      <strong>Sign-in is turned off</strong>
      <p>This site currently has <strong>no authentication</strong>. Anyone who can reach
      it can start captures and open a browser session that is already signed in to the
      systems under review.</p>
      ${todo}
      </div>
      <a class="btn secondary" href="/">Continue without signing in →</a>`;
    return;
  }

  $('state').innerHTML =
    `<a class="btn primary" href="/auth/login?next=${encodeURIComponent(nextTarget())}">
       Sign in with Okta
     </a>
     ${cfg.issuer ? `<p class="fineprint">You will be sent to ${esc(cfg.issuer)}.</p>` : ''}`;
}

render();
</script>
</body></html>
