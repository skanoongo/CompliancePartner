server {
    listen 8080 default_server;

    # The name this site is published under. The hyphenated form is listed too
    # because underscores are not legal in a hostname (RFC 1123) - some resolvers
    # and proxies drop them, so the valid spelling is always available as well.
    server_name cw_CompliancePartnercore.internal.coreweave.com
                cw-compliancepartnercore.internal.coreweave.com
                localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The page is a prototype full of illustrative data; nothing here should be
    # cached into someone's browser and mistaken for current evidence later.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The job API. A capture takes many minutes, so the read timeout is generous;
    # buffering is off so log lines reach the page as they happen.
    location /api/ {
        proxy_pass http://runner:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }

    # The live browser session, for completing SSO. Needs websocket upgrade.
    location /session/ {
        proxy_pass http://runner:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
