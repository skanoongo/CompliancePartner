server {
    listen 8080 default_server;

    # The name this site is published under. The hyphenated form is listed too
    # because underscores are not legal in a hostname (RFC 1123) - some resolvers
    # and proxies drop them, so the valid spelling is always available as well.
    server_name cw_CompliancePartnercore.internal.coreweave.com
                cw-compliancepartnercore.internal.coreweave.com
                localhost;

    root /usr/share/nginx/html;
    index index.html;

    # The page is a prototype full of illustrative data; nothing here should be
    # cached into someone's browser and mistaken for current evidence later.
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------- sign-in
    # Every gated location asks this first. The runner answers 200 when there is
    # a valid session, 401 otherwise - and 200 unconditionally when sign-in is
    # turned off, so an unconfigured install still works.
    location = /auth_verify {
        internal;
        proxy_pass http://runner:8000/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # The login flow itself must never be gated, or signing in would require
    # already being signed in.
    location /auth/ {
        proxy_pass http://runner:8000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login  { try_files /login.html =404; }
    location = /choose { auth_request /auth_verify; try_files /choose.html =404; }

    # Stylesheet for the login and picker pages - needed before sign-in.
    location = /auth.css { }

    # A browser that is not signed in gets sent to the login page, carrying where
    # it was trying to go. Anything asked for as JSON gets a 401 instead, so the
    # workspace's fetches fail honestly rather than parsing an HTML page.
    error_page 401 = @signin;

    location @signin {
        if ($http_accept !~* text/html) { return 401; }
        return 302 /login?next=$request_uri;
    }

    # ---------------------------------------------------------------- the app
    location / {
        auth_request /auth_verify;
        try_files $uri $uri/ /index.html;
    }

    # The job API. A capture takes many minutes, so the read timeout is generous;
    # buffering is off so log lines reach the page as they happen.
    location /api/ {
        auth_request /auth_verify;
        proxy_pass http://runner:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 64m;
    }

    # The live browser session, for completing SSO. Gated like everything else -
    # this one hardest of all, since it is an interactive window already signed
    # in to the system under review.
    location /session/ {
        auth_request /auth_verify;
        proxy_pass http://runner:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
