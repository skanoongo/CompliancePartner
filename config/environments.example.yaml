# Compliance Partner - environment credentials.
#
#   cp config/environments.example.yaml config/environments.yaml
#
# config/environments.yaml is gitignored and must stay that way: it holds live
# credentials for production systems. This example file is the one that is
# committed, and it must never contain a real secret.
#
# One section per system offered in the Compliance Partner page. Only the ones
# with `enabled: true` AND a capture behind them actually run today - that is
# Workato. The rest are here so the shape is settled before their captures exist.
#
# PASSWORDS
# ---------
# Prefer NOT to write a password here at all. Any value may instead be written as
# ${VAR}, which is read from the runner's environment at load time:
#
#     password: ${WORKATO_PASSWORD}
#
# and supplied by the shell, a .env file, or a secrets manager. A password that
# only ever lives in a process environment is one that cannot be committed by
# accident.
#
# SSO AND MFA
# -----------
# `login: form` fills the username and password on the sign-in page. It cannot
# complete an SSO redirect or an MFA challenge - nothing can, without a human. When
# a login needs either, the run pauses and asks a person to finish it in the
# browser session, exactly as it does with no credentials configured. Set
# `login: interactive` to skip the form attempt and go straight there.

environments:

  # ------------------------------------------------------------------ Workato
  # The only system with a capture behind it today.
  workato:
    name: Workato
    enabled: true
    base_url: https://app.workato.com
    login: form
    username: someone@coreweave.com
    password: ${WORKATO_PASSWORD}
    # Workspace that must be visible on every captured page. The capture aborts
    # rather than collect evidence from the wrong one.
    workspace: Production
    # Offered in the Workspace box on the page. List the ones this account can
    # actually reach - a name that does not exist fails the capture's own check
    # several minutes into a run, after the sign-in.
    workspaces:
      - Production
      - CW Agentic
      - Development

  # ---------------------------------------------------------------- NetSuite
  netsuite:
    name: NetSuite
    enabled: true
    # Sign-in happens here; the application itself lives on the account host,
    # which is derived from account_id below (7258820_SB1 ->
    # https://7258820-sb1.app.netsuite.com). The capture checks it landed on the
    # right account, because evidence from the wrong one looks entirely normal.
    base_url: https://system.netsuite.com
    login_url: https://system.netsuite.com/pages/customerlogin.jsp?country=US
    account_id: 7258820_SB1
    login: form
    username: someone@coreweave.com
    password: ${NETSUITE_PASSWORD}
    # Role to pick on NetSuite's role picker. Selected only when a row matches
    # BOTH this role AND account_id above - an Administrator role in a different
    # account is never chosen, because that produces a workbook that looks right
    # and holds the wrong population. No match means a person picks it by hand.
    role: Administrator
    # NetSuite pushes most administrator roles through 2FA, which nothing can
    # automate. Role selection IS automated (it is just a link); 2FA is not. The
    # run pauses for that and asks a person to finish in the browser session.

  # ----------------------------------------------------------------- Workday
  workday:
    name: Workday
    enabled: false
    base_url: https://www.myworkday.com
    login: interactive
    username: someone@coreweave.com
    password: ${WORKDAY_PASSWORD}

  # -------------------------------------------------------------- Salesforce
  salesforce:
    name: Salesforce
    enabled: false
    base_url: https://login.salesforce.com
    login: interactive
    username: someone@coreweave.com
    password: ${SALESFORCE_PASSWORD}

  # ------------------------------------------------------------------- Coupa
  coupa:
    name: Coupa
    enabled: false
    base_url: https://coreweave.coupahost.com
    login: interactive
    username: someone@coreweave.com
    password: ${COUPA_PASSWORD}

  # ---------------------------------------------------------------- Orderful
  orderful:
    name: Orderful
    enabled: false
    base_url: https://app.orderful.com
    login: interactive
    username: someone@coreweave.com
    password: ${ORDERFUL_PASSWORD}

  # ------------------------------------------------------------------ GitHub
  github:
    name: GitHub
    enabled: false
    base_url: https://github.com
    login: interactive
    username: someone@coreweave.com
    password: ${GITHUB_PASSWORD}

  # -------------------------------------------------------------------- Okta
  okta:
    name: Okta
    enabled: false
    base_url: https://coreweave.okta.com
    login: interactive
    username: someone@coreweave.com
    password: ${OKTA_PASSWORD}

  # ---------------------------------------------------------------- FloQast
  floqast:
    name: FloQast
    enabled: false
    base_url: https://go.floqast.com
    login: interactive
    username: someone@coreweave.com
    password: ${FLOQAST_PASSWORD}
